<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Teammate Finder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #58a6ff;
    }

    header p {
      margin-top: 0.4rem;
      color: #8b949e;
      font-size: 0.95rem;
    }

    .search-bar {
      display: flex;
      gap: 0.5rem;
      max-width: 700px;
      margin: 0 auto 2rem;
    }

    .search-bar input {
      flex: 1;
      padding: 0.65rem 1rem;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #161b22;
      color: #e6edf3;
      font-size: 1rem;
      outline: none;
    }

    .search-bar input:focus {
      border-color: #58a6ff;
    }

    .search-bar button {
      padding: 0.65rem 1.4rem;
      border-radius: 6px;
      border: none;
      background: #238636;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .search-bar button:hover { background: #2ea043; }
    .search-bar button:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }

    #status {
      text-align: center;
      color: #8b949e;
      font-size: 0.9rem;
      min-height: 1.4rem;
      margin-bottom: 1.5rem;
    }

    #results {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1.1rem 1.3rem;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.6rem;
    }

    .card-header img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid #30363d;
    }

    .card-header .owner-name {
      font-weight: 600;
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .card-header .owner-name:hover { text-decoration: underline; }

    .repo-name {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .repo-name a {
      color: #79c0ff;
      text-decoration: none;
    }

    .repo-name a:hover { text-decoration: underline; }

    .repo-desc {
      font-size: 0.875rem;
      color: #8b949e;
      margin-bottom: 0.6rem;
      line-height: 1.5;
    }

    .repo-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: #8b949e;
    }

    .repo-meta span { display: flex; align-items: center; gap: 0.25rem; }

    .lang-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f1e05a;
      display: inline-block;
    }

    .topics {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.6rem;
    }

    .topic {
      background: #1f3d5c;
      color: #79c0ff;
      border-radius: 999px;
      padding: 0.15rem 0.6rem;
      font-size: 0.75rem;
    }

    .error { color: #f85149; text-align: center; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>GitHub Teammate Finder</h1>
    <p>Describe your project idea to find relevant GitHub developers.</p>
  </header>

  <form class="search-bar" id="searchForm">
    <input
      type="text"
      id="queryInput"
      placeholder="e.g. AI event planning app with calendars and recommendations"
      autocomplete="off"
    />
    <button type="submit" id="searchBtn">Search</button>
  </form>

  <div id="status"></div>
  <div id="results"></div>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("queryInput");
    const btn = document.getElementById("searchBtn");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    const LANG_COLORS = {
      Python: "#3572A5", JavaScript: "#f1e05a", TypeScript: "#2b7489",
      Go: "#00ADD8", Rust: "#dea584", Java: "#b07219", "C++": "#f34b7d",
      C: "#555555", Ruby: "#701516", Swift: "#ffac45", Kotlin: "#A97BFF",
      Shell: "#89e051", HTML: "#e34c26", CSS: "#563d7c",
    };

    function langColor(lang) {
      return LANG_COLORS[lang] || "#8b949e";
    }

    function renderCard(repo) {
      const ownerLogin = repo.owner || "";
      const ownerUrl = `https://github.com/${ownerLogin}`;
      const avatarUrl = `https://github.com/${ownerLogin}.png?size=36`;
      const topics = (repo.topics || []).slice(0, 6);

      return `
        <div class="card">
          <div class="card-header">
            <img src="${avatarUrl}" alt="${ownerLogin}" loading="lazy" />
            <a class="owner-name" href="${ownerUrl}" target="_blank" rel="noopener">${ownerLogin}</a>
          </div>
          <div class="repo-name">
            <a href="${repo.html_url}" target="_blank" rel="noopener">${repo.full_name}</a>
          </div>
          ${repo.description ? `<div class="repo-desc">${escHtml(repo.description)}</div>` : ""}
          <div class="repo-meta">
            ${repo.language ? `<span><span class="lang-dot" style="background:${langColor(repo.language)}"></span>${escHtml(repo.language)}</span>` : ""}
            <span>&#9733; ${(repo.stargazers_count || 0).toLocaleString()}</span>
            ${repo.updated_at ? `<span>Updated ${formatDate(repo.updated_at)}</span>` : ""}
          </div>
          ${topics.length ? `<div class="topics">${topics.map(t => `<span class="topic">${escHtml(t)}</span>`).join("")}</div>` : ""}
        </div>`;
    }

    function escHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;

      btn.disabled = true;
      status.textContent = "Searching...";
      results.innerHTML = "";

      try {
        const res = await fetch(`/api/search/repos?q=${encodeURIComponent(q)}&per_page=20`);
        const data = await res.json();

        if (!res.ok) {
          status.innerHTML = `<span class="error">Error: ${escHtml(data.error || "Unknown error")}</span>`;
          return;
        }

        const items = data.items || [];
        status.textContent = `${data.total_count?.toLocaleString() ?? 0} repositories found — showing top ${items.length}`;
        results.innerHTML = items.map(renderCard).join("");
      } catch (err) {
        status.innerHTML = `<span class="error">Request failed: ${escHtml(err.message)}</span>`;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
