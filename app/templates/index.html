<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Teammate Finder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 { font-size: 1.8rem; font-weight: 700; color: #58a6ff; }
    header p  { margin-top: 0.4rem; color: #8b949e; font-size: 0.95rem; }

    .search-bar {
      display: flex;
      gap: 0.5rem;
      max-width: 700px;
      margin: 0 auto 2rem;
    }

    .search-bar input {
      flex: 1;
      padding: 0.65rem 1rem;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #161b22;
      color: #e6edf3;
      font-size: 1rem;
      outline: none;
    }

    .search-bar input:focus { border-color: #58a6ff; }

    .char-counter {
      text-align: right;
      font-size: 0.78rem;
      color: #8b949e;
      max-width: 700px;
      margin: -1.4rem auto 1.5rem;
    }

    .char-counter.warn  { color: #d29922; }
    .char-counter.limit { color: #f85149; }

    .search-bar button {
      padding: 0.65rem 1.4rem;
      border-radius: 6px;
      border: none;
      background: #238636;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .search-bar button:hover    { background: #2ea043; }
    .search-bar button:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }

    #status {
      text-align: center;
      color: #8b949e;
      font-size: 0.875rem;
      min-height: 1.4rem;
      margin-bottom: 1.5rem;
    }

    #results {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* ── Candidate card ── */
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1.2rem 1.4rem;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 0.7rem;
    }

    .card-header img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid #30363d;
      flex-shrink: 0;
    }

    .card-header-info { flex: 1; min-width: 0; }

    .card-header-info .username {
      font-weight: 700;
      font-size: 1rem;
      color: #58a6ff;
      text-decoration: none;
    }

    .card-header-info .username:hover { text-decoration: underline; }

    .card-header-info .display-name {
      font-size: 0.85rem;
      color: #8b949e;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 0.75rem;
    }

    .bio {
      font-size: 0.875rem;
      color: #c9d1d9;
      margin-bottom: 0.75rem;
      line-height: 1.55;
    }

    /* ── Tag rows ── */
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.6rem;
    }

    .tag {
      border-radius: 999px;
      padding: 0.15rem 0.6rem;
      font-size: 0.75rem;
    }

    .tag-lang { background: #21262d; color: #e6edf3; }
    .tag-topic { background: #1f3d5c; color: #79c0ff; }

    .lang-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
      vertical-align: middle;
    }

    /* ── Repo list inside card ── */
    .repo-list { margin-top: 0.9rem; }

    .repo-list-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8b949e;
      margin-bottom: 0.5rem;
    }

    .repo-item {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      margin-bottom: 0.4rem;
    }

    .repo-item:last-child { margin-bottom: 0; }

    .repo-item-name a {
      font-weight: 600;
      font-size: 0.875rem;
      color: #79c0ff;
      text-decoration: none;
    }

    .repo-item-name a:hover { text-decoration: underline; }

    .repo-item-desc {
      font-size: 0.8rem;
      color: #8b949e;
      margin-top: 0.2rem;
      line-height: 1.4;
    }

    .repo-item-meta {
      display: flex;
      gap: 0.75rem;
      font-size: 0.75rem;
      color: #8b949e;
      margin-top: 0.3rem;
    }

    /* ── Score + explanation ── */
    .card-score-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.6rem;
      flex-wrap: wrap;
    }

    .rank-badge {
      font-size: 0.8rem;
      font-weight: 700;
      color: #8b949e;
      white-space: nowrap;
      min-width: 2rem;
    }

    .score-badge {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      background: #161b22;
      border: 1px solid currentColor;
      white-space: nowrap;
    }

    .explanation {
      font-size: 0.875rem;
      color: #c9d1d9;
      line-height: 1.6;
      padding: 0.6rem 0.85rem;
      background: #0d1117;
      border-left: 3px solid #30363d;
      border-radius: 0 6px 6px 0;
      margin-bottom: 0.75rem;
    }

    .evidence-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-bottom: 0.65rem;
    }

    .evidence-term {
      background: #2d1f4e;
      color: #d2a8ff;
      border-radius: 4px;
      padding: 0.1rem 0.45rem;
      font-size: 0.72rem;
    }

    .error { color: #f85149; text-align: center; font-size: 0.9rem; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <h1>GitHub Teammate Finder</h1>
    <p>Describe your project idea to find relevant GitHub developers.</p>
  </header>

  <form class="search-bar" id="searchForm">
    <input
      type="text"
      id="queryInput"
      placeholder="e.g. AI event planning app with calendars and recommendations"
      autocomplete="off"
      maxlength="400"
    />
    <button type="submit" id="searchBtn">Find Teammates</button>
  </form>
  <div class="char-counter" id="charCounter">400 characters remaining</div>

  <div id="status"></div>
  <div id="results"></div>

  <script>
    const form        = document.getElementById("searchForm");
    const input       = document.getElementById("queryInput");
    const btn         = document.getElementById("searchBtn");
    const status      = document.getElementById("status");
    const results     = document.getElementById("results");
    const charCounter = document.getElementById("charCounter");

    const MAX_CHARS = 400;

    input.addEventListener("input", () => {
      const remaining = MAX_CHARS - input.value.length;
      charCounter.textContent = `${remaining} character${remaining !== 1 ? "s" : ""} remaining`;
      charCounter.className = "char-counter" + (remaining <= 0 ? " limit" : remaining <= 50 ? " warn" : "");
    });

    const LANG_COLORS = {
      Python: "#3572A5", JavaScript: "#f1e05a", TypeScript: "#2b7489",
      Go: "#00ADD8", Rust: "#dea584", Java: "#b07219", "C++": "#f34b7d",
      C: "#555555", Ruby: "#701516", Swift: "#ffac45", Kotlin: "#A97BFF",
      Shell: "#89e051", HTML: "#e34c26", CSS: "#563d7c",
    };

    function escHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function langColor(lang) { return LANG_COLORS[lang] || "#8b949e"; }

    function scoreColor(score) {
      if (score >= 0.4) return "#3fb950";
      if (score >= 0.2) return "#d29922";
      return "#8b949e";
    }

    function renderCandidate(c, rank) {
      const langs    = (c.languages || []).slice(0, 8);
      const topics   = (c.topics    || []).slice(0, 10);
      const repos    = (c.repos     || []).slice(0, 5);
      const evidence = (c.evidence  || []).slice(0, 8);

      const langTags = langs.map(l =>
        `<span class="tag tag-lang">
          <span class="lang-dot" style="background:${langColor(l)}"></span>${escHtml(l)}
        </span>`
      ).join("");

      const topicTags = topics.map(t =>
        `<span class="tag tag-topic">${escHtml(t)}</span>`
      ).join("");

      const repoItems = repos.map(r => `
        <div class="repo-item">
          <div class="repo-item-name">
            <a href="${escHtml(r.html_url || "#")}" target="_blank" rel="noopener">${escHtml(r.name || "")}</a>
          </div>
          ${r.description ? `<div class="repo-item-desc">${escHtml(r.description)}</div>` : ""}
          <div class="repo-item-meta">
            ${r.language ? `<span><span class="lang-dot" style="background:${langColor(r.language)}"></span>${escHtml(r.language)}</span>` : ""}
            <span>&#9733; ${(r.stars || 0).toLocaleString()}</span>
          </div>
        </div>`
      ).join("");

      const scoreHtml = c.score != null ? `
        <div class="card-score-row">
          <span class="rank-badge">#${rank}</span>
          <span class="score-badge" style="color:${scoreColor(c.score)}">
            ${(c.score * 100).toFixed(1)}% match
          </span>
        </div>
        ${c.explanation ? `<div class="explanation">${escHtml(c.explanation)}</div>` : ""}
        ${evidence.length ? `
          <div class="evidence-chips">
            ${evidence.map(t => `<span class="evidence-term">${escHtml(t)}</span>`).join("")}
          </div>` : ""}` : "";

      return `
        <div class="card">
          <div class="card-header">
            <img src="${escHtml(c.avatar_url || "")}" alt="${escHtml(c.username)}" loading="lazy" />
            <div class="card-header-info">
              <a class="username" href="${escHtml(c.profile_url || "#")}" target="_blank" rel="noopener">
                ${escHtml(c.username)}
              </a>
              ${c.name ? `<div class="display-name">${escHtml(c.name)}</div>` : ""}
            </div>
          </div>

          <div class="card-meta">
            ${c.location ? `<span>&#128205; ${escHtml(c.location)}</span>` : ""}
            ${c.followers != null ? `<span>&#128101; ${c.followers.toLocaleString()} followers</span>` : ""}
            ${c.public_repos != null ? `<span>&#128193; ${c.public_repos} repos</span>` : ""}
          </div>

          ${scoreHtml}
          ${c.bio ? `<div class="bio">${escHtml(c.bio)}</div>` : ""}


          ${langTags  ? `<div class="tag-row">${langTags}</div>`  : ""}
          ${topicTags ? `<div class="tag-row">${topicTags}</div>` : ""}

          ${repoItems ? `
            <div class="repo-list">
              <div class="repo-list-title">Top repositories</div>
              ${repoItems}
            </div>` : ""}
        </div>`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;

      btn.disabled = true;
      results.innerHTML = "";
      status.innerHTML  = `<span class="spinner"></span>Fetching candidates — this may take a few seconds…`;

      const source = new EventSource(`/api/candidates/stream?q=${encodeURIComponent(q)}&per_page=20`);

      source.addEventListener("ranking", (event) => {
        const data = JSON.parse(event.data || "{}");
        status.innerHTML = `<span class="spinner"></span>${escHtml(data.message || "Candidates fetched - ranking candidates...")}`;
      });

      source.addEventListener("complete", (event) => {
        const data = JSON.parse(event.data || "{}");
        const candidates = data.candidates || [];
        status.textContent = `Found ${candidates.length} candidate${candidates.length !== 1 ? "s" : ""} for: "${q}"`;
        results.innerHTML  = candidates.map((c, i) => renderCandidate(c, i + 1)).join("");

        if (!candidates.length) {
          status.textContent = "No candidates found. Try a different query.";
        }

        source.close();
        btn.disabled = false;
      });

      source.addEventListener("error", (event) => {
        let message = "Unknown error";
        if (event.data) {
          const data = JSON.parse(event.data);
          message = data.error || message;
        }
        status.innerHTML = `<span class="error">Error: ${escHtml(message)}</span>`;
        source.close();
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
